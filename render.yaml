databases:
  - name: bloodbank-db
    databaseName: bloodbank
    user: bloodbank
    plan: free

services:
  - type: web
    name: bloodbank
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloodbank-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: SEED_ON_START
        value: "true"
      - key: NODE_ENV
        value: production
